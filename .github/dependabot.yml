version: 2
updates:
  # Library build/release toolchain
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Batch weekly minor+patch bumps into ONE PR (majors still come individually so a breaking major can't
    # hold back the safe bumps). All are auto-merged once green by dependabot-auto-merge.yml.
    groups:
      root-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7.x is the native (Go) compiler; its programmatic API is not yet
      # compatible with tsup's DTS generation (rollup-plugin-dts) — the build crashes with
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')" (#199).
      # Keep on the 5.x line until the native compiler's API stabilizes for build tooling.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Documentation site
  - package-ecosystem: "npm"
    directory: "/site"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
