name: Release

# Fully automated semantic versioning. On every push to main, semantic-release
# reads the Conventional Commits since the last release, computes the next
# version (fix -> patch, feat -> minor, feat!/BREAKING CHANGE -> major),
# publishes to npm, tags vX.Y.Z, updates CHANGELOG.md + package.json, and
# creates a GitHub Release. No manual version bumps. If no release-worthy
# commits are present, it does nothing.
# A manual trigger as well, because the push trigger is the single point of failure for the whole
# release: if GitHub does not create a run for the merge commit (it silently created none for the
# v1.45 release push - workflow_dispatch worked throughout, push and pull_request did not), main ends
# up ahead of the last tag with nothing published and no way to retry short of another commit.
# Dispatching this on main does exactly what the push would have: semantic-release reads the
# Conventional Commits since the last tag and is a no-op when there are none.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags, GitHub release, and the changelog/version commit back to main
  issues: write # semantic-release release comments
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so commit analysis can find the last release
          persist-credentials: true

      - name: Setup Node.js
        # 26, not the 22 the other workflows use, because semantic-release enforces its own
        # engines.node at runtime (bin/semantic-release.js checks process.version and exits):
        #   [semantic-release]: node version >=26.13 is required. Found v22.x.
        # semantic-release 26.0.1 arrived by Dependabot auto-merge (#546) and release.yml is the
        # only workflow that runs it, so no CI job exercised the combination - the first sign would
        # have been a failed release on main. tests/release-node-version.test.js now ties this
        # version to that engines range, so the next such bump is a red suite on dev instead.
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
